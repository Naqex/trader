name: Release candidate
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    name: Windows candidate
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '3.12'}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: '22'}
      - name: Release contracts
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python scripts/release.py check
          python scripts/check_paths.py
          python -m unittest discover -s tests -p test_release_workflow.py -v
      - name: Build frozen sources
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/naqex-target
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install uv==0.12.5
          uv sync --locked --project foundation_v2
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          cargo test --locked --manifest-path foundation_v2/api-rust/Cargo.toml
          cargo build --release --locked --manifest-path foundation_v2/api-rust/Cargo.toml
          npm ci --prefix foundation_v2/web --ignore-scripts --no-audit --no-fund
          npm ci --prefix foundation_v2/data_worker --ignore-scripts --no-audit --no-fund
          npm run build --prefix foundation_v2/web
      - name: Browser fixture smoke
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm exec --prefix foundation_v2/web -- playwright install chromium
          node foundation_v2/web/tests/brand.browser.mjs
      - name: Collect dependency notices and package
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python scripts/dependency_notices.py --output "${{ runner.temp }}/naqex-notices"
          python scripts/release.py package --output "${{ runner.temp }}/naqex-candidate" --binary-dir "${{ runner.temp }}/naqex-target/release" --web-dist foundation_v2/web/dist --notices-dir "${{ runner.temp }}/naqex-notices"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: naqex-trader-windows-candidate
          path: ${{ runner.temp }}/naqex-candidate/*
          if-no-files-found: error
          retention-days: 14
