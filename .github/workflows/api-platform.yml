name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  hygiene:
    name: Hygiene and release contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '3.12'}
      - run: python scripts/release.py check
      - run: python scripts/check_paths.py
      - run: python -m unittest discover -s tests -p test_release_workflow.py -v
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}
      - name: Verified pinned Gitleaks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v8.30.1 --repo gitleaks/gitleaks --pattern gitleaks_8.30.1_linux_x64.tar.gz --dir "$RUNNER_TEMP/naqex-tools"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  '"$RUNNER_TEMP/naqex-tools/gitleaks_8.30.1_linux_x64.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/naqex-tools/gitleaks_8.30.1_linux_x64.tar.gz" -C "$RUNNER_TEMP/naqex-tools"
          "$RUNNER_TEMP/naqex-tools/gitleaks" git --redact --no-banner --log-opts HEAD
  python:
    name: Python contracts
    runs-on: windows-latest
    defaults:
      run: {shell: pwsh}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '3.12'}
      - name: Locked adapters and contracts
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install uv==0.12.5
          uv sync --locked --project foundation_v2
          foundation_v2/.venv/Scripts/python.exe -B -m unittest discover -s tests -p test_release_workflow.py -v
          foundation_v2/.venv/Scripts/python.exe -B foundation_v2/scripts/export_api_command_contracts.py --check
          foundation_v2/.venv/Scripts/python.exe -B foundation_v2/scripts/api_platform_openapi.py
          foundation_v2/.venv/Scripts/python.exe -B foundation_v2/api-rust/tests/export_prop_schemas.py --check
          foundation_v2/.venv/Scripts/python.exe -B -m pytest foundation_v2/tests/test_api_command_worker.py foundation_v2/tests/test_api_platform_launcher.py foundation_v2/tests/test_api_platform_backup.py foundation_v2/tests/test_artifact_storage_architecture.py foundation_v2/tests/test_trades_page.py foundation_v2/tests/test_trades_page_performance.py -q
  web:
    name: Web build and browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run: {working-directory: foundation_v2/web}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: foundation_v2/web/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test tests/scopedMutation.test.mjs tests/scopedRead.test.mjs tests/clientNavigation.test.mjs tests/workspaceEvents.test.mjs tests/chartAnnotations.test.mjs tests/dataDeskApi.test.mjs tests/sessionPicker.test.mjs tests/dashboardModel.test.mjs tests/shellPreferences.test.mjs
      - run: npm run build
      - run: npx --no-install playwright install --with-deps chromium
      - run: node tests/brand.browser.mjs
      - run: node tests/live-analytics.browser.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: web-failure-evidence
          path: |
            foundation_v2/web/.artifacts/brand
            foundation_v2/web/.artifacts/live-analytics-controls
          retention-days: 7
          if-no-files-found: ignore
  rust:
    name: Rust tests and lint
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run: {working-directory: foundation_v2/api-rust}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '3.12'}
      - name: Locked Python process fixtures
        working-directory: .
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install uv==0.12.5
          uv sync --locked --project foundation_v2
      - name: Pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets
