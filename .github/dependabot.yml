version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 2
    groups:
      actions: {patterns: ['*']}
  - package-ecosystem: npm
    directory: /foundation_v2/web
    schedule: {interval: weekly}
    open-pull-requests-limit: 2
    groups:
      compatible: {patterns: ['*'], update-types: [minor, patch]}
  - package-ecosystem: npm
    directory: /foundation_v2/data_worker
    schedule: {interval: weekly}
    open-pull-requests-limit: 1
  - package-ecosystem: cargo
    directory: /foundation_v2/api-rust
    schedule: {interval: weekly}
    open-pull-requests-limit: 2
    groups:
      compatible: {patterns: ['*'], update-types: [minor, patch]}
  - package-ecosystem: uv
    directory: /foundation_v2
    schedule: {interval: weekly}
    open-pull-requests-limit: 2
    groups:
      compatible: {patterns: ['*'], update-types: [minor, patch]}
  - package-ecosystem: uv
    directory: /foundation_v2/engine_runtime
    schedule: {interval: monthly}
    open-pull-requests-limit: 1
