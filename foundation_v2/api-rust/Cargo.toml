[package]
name = "trading-workspace-api"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "=0.8.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync", "process", "io-util", "fs"] }
tower = { version = "0.5", features = ["util"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
serde_yaml_ng = "=0.10.0"
deadpool-postgres = "0.14"
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-chrono-0_4", "with-uuid-1"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
bytes = "1"
tokio-stream = "0.1"
async-stream = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
subtle = "2"
form_urlencoded = "1"
percent-encoding = "2"
jsonschema = { version = "=0.58.6", default-features = false }
bigdecimal = "=0.4.10"
num-bigint = "0.4"
csv = "=1.4.0"
chrono-tz = "=0.10.4"
parquet = { version = "=59.3.0", default-features = false, features = ["snap", "zstd", "flate2-rust_backend", "lz4"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls"] }
getrandom = "=0.4.3"
base64 = "=0.22.1"
rmcp = { version = "=3.7.0", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
reqwest-mcp = { package = "reqwest", version = "=0.13.2", default-features = false, features = ["json", "stream"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading"] }

[dev-dependencies]
http-body-util = "0.1"
