[project]
name = "naqex-trader-adapters"
version = "0.1.0a1"
license = "LicenseRef-Naqex-Source-Available-1.0.0"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.4,<2",
  "fastapi>=0.162.0,<1",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "psycopg-pool>=3.2,<4",
  "pyarrow>=21,<22",
  "pydantic>=2.14.1,<3",
  "uvicorn>=0.54.0,<1",
]

[project.optional-dependencies]
workflow = ["langgraph==1.2.17"]
mt5 = [
    "metatrader5>=5.0.6231 ; sys_platform == 'win32'",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

