[project]
name = "naqex-trader-adapters"
version = "0.1.0a1"
license = "LicenseRef-Naqex-Source-Available-1.0.0"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=2.0.0,<3",
  "fastapi>=0.162.0,<1",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.3.8,<4",
  "psycopg-pool>=3.2,<4",
  "pyarrow>=26.0.0,<27",
  # 2.14 drops Decimal schema patterns required by the frozen command contracts.
  "pydantic>=2.11,<2.14",
  "uvicorn>=0.54.0,<1",
]

[project.optional-dependencies]
workflow = ["langgraph==1.2.19"]
mt5 = [
    "metatrader5>=5.0.6231 ; sys_platform == 'win32'",
]

[dependency-groups]
dev = ["pytest==9.2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

